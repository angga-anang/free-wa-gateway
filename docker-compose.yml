services:
  postgres:
    image: postgres:16-alpine
    container_name: freegw_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freegw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing. Put it in the .env file next to docker-compose.yml (install.sh creates it)}
      POSTGRES_DB: ${POSTGRES_DB:-freegw_gateway}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - freegw_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-freegw}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: freegw_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  freegw_pg_data:
